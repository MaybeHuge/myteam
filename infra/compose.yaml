name: myteam
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: myteam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置数据库密码}
      POSTGRES_DB: myteam
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/010-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myteam -d myteam']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -webdav=false
      - -admin.ui=false
      - -admin.port.legacy=0
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.autoCreateBucket=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?请设置 S3 访问标识}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?请设置 S3 访问密钥}
      S3_BUCKET: ${S3_BUCKET:?请设置资源桶名称}
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
